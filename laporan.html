<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan — TOKO BANGUNAN</title>
<meta name="description" content="Laporan transaksi, penjualan, stok, dan audit toko bangunan.">
<meta name="theme-color" content="#0b2a4a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script>(function(){try{var t=localStorage.getItem('tb_theme');if(t!=='dark'&&t!=='light')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t);if(sessionStorage.getItem('tb_loaded')){document.documentElement.classList.add('no-loader')}else{document.documentElement.classList.add('loading')}}catch(e){}})();</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body class="guard-pending" data-shell="dash" data-title="Laporan" data-roles="owner,kasir,admin">
<div id="tb-loader" role="status" aria-live="polite" aria-label="Memuat TOKO BANGUNAN"><div class="ld-box"><div class="ld-logo"><svg width="84" height="84" viewBox="0 0 64 64" role="img" aria-label="Logo TOKO BANGUNAN"><rect width="64" height="64" rx="14" fill="#f26b1d"/><path d="M8 31L32 11l24 20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 29v23h34V29" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><rect x="21" y="36" width="9" height="6" rx="1" fill="#fff"/><rect x="33" y="36" width="9" height="6" rx="1" fill="#fff"/><rect x="27" y="44" width="10" height="6" rx="1" fill="#0b2a4a"/></svg></div><b>TOKO BANGUNAN</b><div class="ld-sub">Mitra Pembangunan Anda</div><div class="ld-bar"><i></i></div><small>Memuat sistem…</small></div></div>
<div class="dash" id="dash"><aside class="dash-side" id="dash-side"></aside><div class="dash-scrim" id="dash-scrim"></div><div class="dash-body"><header class="dash-top" id="dash-top"></header>
<main class="dash-main" id="page">

<div class="tabs" role="tablist" id="lap-tabs"></div>
<div class="filter-bar" id="lap-filters">
  <label class="field"><span>Dari tanggal</span><input class="input" type="date" id="l-from"></label>
  <label class="field"><span>Sampai tanggal</span><input class="input" type="date" id="l-to"></label>
  <label class="field grow"><span>Cari</span><input class="input" type="search" id="l-q" placeholder="Nomor, pelanggan, produk…"></label>
  <label class="field" id="l-status-wrap"><span>Status pembayaran</span><select class="input" id="l-status"><option value="">Semua</option><option>Lunas</option><option>Menunggu Pembayaran</option><option>COD (Belum Dibayar)</option><option>Bayar di Toko</option></select></label>
  <button class="btn btn-outline" id="l-csv" type="button"><span data-ic="download" data-size="18"></span> Ekspor CSV</button>
</div>
<section id="lap-transaksi" hidden>
  <div class="tbl-wrap"><table class="tbl cards-sm"><thead><tr><th>No.</th><th>Waktu</th><th>Pelanggan</th><th>Kasir</th><th>Metode</th><th class="num">Total</th><th>Pembayaran</th><th>Pesanan</th><th></th></tr></thead><tbody id="lt-body"></tbody></table></div><div class="pager" id="lt-pager"></div>
</section>
<section id="lap-penjualan" hidden><div class="stat-grid" id="lp-stats"></div><div class="grid-2e"><div class="card panel"><h3>Penjualan per Hari</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tanggal</th><th class="num">Transaksi</th><th class="num">Omzet</th><th class="num" data-profit>Laba kotor</th></tr></thead><tbody id="lp-days"></tbody></table></div></div><div class="card panel"><h3>Penjualan per Produk</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Produk</th><th class="num">Qty</th><th class="num">Omzet</th></tr></thead><tbody id="lp-prods"></tbody></table></div></div></div></section>
<section id="lap-stok" hidden><div class="stat-grid" id="ls-stats"></div><div class="tbl-wrap"><table class="tbl cards-sm"><thead><tr><th>SKU</th><th>Produk</th><th>Kategori</th><th class="num">Stok</th><th class="num">Min.</th><th>Status</th><th class="num" data-cost>Nilai Stok (modal)</th></tr></thead><tbody id="ls-body"></tbody></table></div></section>
<section id="lap-audit" hidden><div class="tbl-wrap"><table class="tbl cards-sm"><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Rincian</th></tr></thead><tbody id="la-body"></tbody></table></div><div class="pager" id="la-pager"></div></section>

</main>
<div id="dash-foot"></div></div></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
<script src="laporan.js"></script>
</body>
</html>
