<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katalog Material — TOKO BANGUNAN</title>
<meta name="description" content="Katalog lengkap material bangunan: cari dan filter berdasarkan kategori, harga, merek, dan stok.">
<meta name="theme-color" content="#0B1422">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script>(function(){try{var t=localStorage.getItem('tb_theme');if(t!=='dark'&&t!=='light')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t);if(sessionStorage.getItem('tb_loaded')){document.documentElement.classList.add('no-loader')}else{document.documentElement.classList.add('loading')}}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body data-shell="public" data-active="katalog">
<div id="tb-loader" role="status" aria-live="polite" aria-label="Memuat TOKO BANGUNAN"><div class="ld-grid" aria-hidden="true"></div><div class="ld-glow" aria-hidden="true"></div><div class="ld-box"><div class="ld-logo"><i class="ld-ring"></i><svg width="96" height="96" viewBox="0 0 64 64" role="img" aria-label="Logo TOKO BANGUNAN"><rect width="64" height="64" rx="15" fill="#FF7626"/><path class="ld-roof" d="M8 31L32 11l24 20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 29v23h34V29" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><rect x="21" y="36" width="9" height="6" rx="1" fill="#fff"/><rect x="33" y="36" width="9" height="6" rx="1" fill="#fff"/><rect x="27" y="44" width="10" height="6" rx="1" fill="#0B1422"/></svg></div><b class="ld-name">TOKO BANGUNAN</b><div class="ld-sub">Mitra Material Konstruksi</div><div class="ld-bricks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="ld-bar"><i id="ld-fill"></i></div><div class="ld-meta"><span id="ld-msg">Menyiapkan sistem…</span><span id="ld-pct">0%</span></div><button type="button" class="ld-skip" id="ld-skip">Lewati</button></div><div class="ld-foot" aria-hidden="true">Katalog &bull; Keranjang &bull; Kasir &bull; Stok</div></div>
<div id="site-header"></div>
<main id="page">

<div class="container">
  <nav class="crumb" aria-label="Breadcrumb"><a href="index.html">Home</a> / <span>Katalog Material</span></nav>
  <div class="sec-head" style="padding-top:10px;margin-bottom:12px"><div><h1 style="font-size:clamp(24px,6vw,30px);margin:0">Katalog Material</h1></div></div>
  <div id="demo-banner"></div>
  <div class="cat-layout">
    <aside class="filters filters-drawer" id="filters" aria-label="Filter produk">
      <div class="fd-head"><h3>Filter Produk</h3><button class="icon-btn" id="fd-close" type="button" aria-label="Tutup filter"><span data-ic="x"></span></button></div>
      <label class="field"><span>Kategori</span><select class="input" id="f-cat"></select></label>
      <label class="field"><span>Merek</span><select class="input" id="f-brand"></select></label>
      <div class="form-grid" style="gap:0 10px">
        <label class="field"><span>Harga min (Rp)</span><input class="input" type="number" min="0" step="1000" id="f-min" inputmode="numeric"></label>
        <label class="field"><span>Harga maks (Rp)</span><input class="input" type="number" min="0" step="1000" id="f-max" inputmode="numeric"></label>
      </div>
      <label class="field"><span>Ketersediaan stok</span><select class="input" id="f-stock"><option value="">Semua</option><option value="ok">Tersedia</option><option value="low">Stok menipis</option><option value="out">Stok habis</option></select></label>
      <label class="check" style="margin-bottom:16px"><input type="checkbox" id="f-promo"> Hanya produk promo</label>
      <button class="btn btn-outline btn-block" id="f-reset" type="button">Reset Filter</button>
      <button class="btn btn-primary btn-block fd-apply" id="fd-apply" type="button" style="margin-top:10px">Tampilkan Hasil</button>
    </aside>
    <div class="fd-scrim" id="fd-scrim"></div>
    <section aria-label="Daftar produk" style="min-width:0">
      <div class="cat-search">
        <label class="field"><span class="sr-only">Cari produk</span><input class="input" type="search" id="f-q" placeholder="Cari semen, pasir, bata, besi, keramik..." autocomplete="off"></label>
        <button class="btn btn-outline" id="f-open" type="button" aria-controls="filters"><span data-ic="filter" data-size="18"></span> Filter</button>
      </div>
      <div class="chips" id="cat-chips" aria-label="Kategori cepat"></div>
      <div class="act-filters" id="act-filters"></div>
      <div class="toolbar">
        <p id="cat-count" class="cat-count" aria-live="polite" style="margin:0"></p>
        <label class="field" style="margin:0;min-width:190px"><span class="sr-only">Urutkan</span>
          <select class="input" id="f-sort"><option value="rel">Urutkan: Unggulan</option><option value="low">Harga terendah</option><option value="high">Harga tertinggi</option><option value="name">Nama A–Z</option><option value="stock">Stok terbanyak</option></select></label>
      </div>
      <div class="prod-grid" id="prod-grid" aria-live="polite"></div>
      <div class="pager" id="pager"></div>
    </section>
  </div>
</div>

</main>
<div id="site-footer"></div>
<script src="data.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
<script src="katalog.js"></script>
</body>
</html>
